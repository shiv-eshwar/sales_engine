# OpenAI API-key routing. The local proxy key is separate from OPENAI_API_KEY.
model_list:
  - model_name: sales-fast
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: responses
  - model_name: sales-research
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: responses
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
litellm_settings:
  drop_params: true
  request_timeout: 180
  num_retries: 2
  allowed_fails: 3
  cooldown_time: 60
